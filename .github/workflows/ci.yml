name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 服务容器：即使当前测试尚未连接，也为后续阶段（迁移检查、集成测试）预留
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: careercopilot
          POSTGRES_USER: careercopilot
          POSTGRES_PASSWORD: careercopilot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careercopilot -d careercopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql+psycopg://careercopilot:careercopilot_dev@localhost:5432/careercopilot
      REDIS_URL: redis://localhost:6379/0
      # 集成测试连 CI 服务容器（本机默认值是 55432/56379，见 DEVELOPMENT.md）
      TEST_PG_PORT: "5432"
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_MAILPIT_API: http://localhost:8025/api/v1
      TEST_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 需要完整历史

      # 不用 gitleaks-action：组织仓库要求付费 license；直接跑官方镜像等效扫描
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact -v
