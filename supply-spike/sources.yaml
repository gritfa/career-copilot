# 供给 Spike 来源清单 v1（第一批：10 家有公开招聘官网的中国公司）
#
# 合规硬边界（ADR-002 / 阶段 10 任务书）：
# - 只允许对公开招聘官网做低频只读检查（robots.txt / 条款页 / 入口页各一次）。
# - 自动请求必须全部满足：无需登录、无验证码、robots.txt 与公开条款未禁止、
#   可识别 UA、单域名 ≤1 请求/2 秒、有超时/重试上限/熔断/缓存。
# - 政策不清 = not_verified = 不自动访问；绝不绕过登录/验证码/反爬。
# - BOSS 直聘不在本清单：只保留搜索跳转 + 用户导入，绝不抓正文。
#
# 每个来源的 probe_result 块由 `run_supply_spike.py probe` 如实写入；
# status ∈ verified / not_verified / blocked，人工只可收紧不可放宽。
# terms_manual_review: pending_owner_confirmation = 条款需人工法务判读，
# 判读通过前该来源永远到不了 verified。
version: 1
user_agent: 'CareerCopilotSpike/0.1 (+contact: careers-spike@placeholder.invalid)'
rate_limit:
  min_interval_seconds: 2.0
  timeout_seconds: 10.0
  max_retries: 2
  circuit_break_after_failures: 3
sources:
