  entry_url: https://jobs.bytedance.com/experienced
  terms_url: null
  source_type: company_site
  allowed_access:
  - robots_txt
  - terms_page
  - entry_page_readonly
  terms_manual_review: pending_owner_confirmation
  status: not_verified
  status_reason: 未探测
